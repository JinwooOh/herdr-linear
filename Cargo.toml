[package]
name = "herdr-linear"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Linear issues and PR review in a Herdr pane"
license = "MIT"

[dependencies]
anyhow = "1"
ratatui = "0.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
